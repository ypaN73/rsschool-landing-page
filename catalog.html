<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <a href="/" class="logo">
            <img
              src="/src/assets/icons/logo.svg"
              alt="Coffee Shop"
              class="logo__img logo__img--light"
            />
            <img
              src="/src/assets/icons/logo-dark.svg"
              alt="Coffee Shop"
              class="logo__img logo__img--dark"
            />
          </a>

          <nav class="nav">
            <ul class="nav__list">
              <li><a href="#favorite" class="nav__link">Favorite coffee</a></li>
              <li><a href="#about" class="nav__link">About</a></li>
              <li><a href="#mobile-app" class="nav__link">Mobile App</a></li>
              <li><a href="#contacts" class="nav__link">Contact us</a></li>
            </ul>
          </nav>

          <div class="header__actions">
            <button
              class="theme-toggle"
              id="theme-toggle"
              aria-label="Переключить тему"
            >
              <img
                src="/src/assets/icons/theme-sun.svg"
                alt=""
                class="theme-toggle__img theme-toggle__img--sun"
              />
              <img
                src="/src/assets/icons/theme-moon.svg"
                alt=""
                class="theme-toggle__img theme-toggle__img--moon"
              />
              <img
                src="/src/assets/icons/theme-hover.svg"
                alt=""
                class="theme-toggle__img theme-toggle__img--hover"
              />
            </button>

            <a
              href="/catalog.html"
              class="menu-btn menu-btn--active"
              aria-label="Меню"
            >
              <span class="menu-btn__text">Menu</span>
              <img
                src="/src/assets/icons/coffee-cup.svg"
                alt=""
                class="menu-btn__img menu-btn__img--light"
              />
              <img
                src="/src/assets/icons/coffee-cup-dark.svg"
                alt=""
                class="menu-btn__img menu-btn__img--dark"
              />
            </a>

            <!-- Бургер: скрыт на десктопе, виден на мобильных -->
            <button class="burger" id="burger" aria-label="Открыть меню">
              <img
                src="/src/assets/icons/button-icon-burger.svg"
                alt=""
                class="burger__img burger__img--light"
              />
              <img
                src="/src/assets/icons/button-icon-burger-dark.svg"
                alt=""
                class="burger__img burger__img--dark"
              />
            </button>
          </div>
        </div>
      </div>
    </header>
    catalog

    <footer class="footer" id="contacts">
      <div class="container">
        <div class="footer__inner">
          <!-- Левая часть: заголовок + соцсети -->
          <div class="footer__offer">
            <h2 class="footer__title">
              <span class="footer__title-line">Sip, Savor, Smile.</span>
              <span class="footer__title-line footer__title-line--accent"
                >It's coffee time!</span
              >
            </h2>

            <ul class="footer__socials">
              <li>
                <a
                  href="https://twitter.com"
                  target="_blank"
                  rel="noopener"
                  class="footer__social"
                  aria-label="Twitter"
                >
                  <img
                    src="/src/assets/icons/twitter.svg"
                    alt=""
                    class="footer__social-icon footer__social-icon--default"
                  />
                  <img
                    src="/src/assets/icons/twitter-dark.svg"
                    alt=""
                    class="footer__social-icon footer__social-icon--hover"
                  />
                </a>
              </li>
              <li>
                <a
                  href="https://instagram.com"
                  target="_blank"
                  rel="noopener"
                  class="footer__social"
                  aria-label="Instagram"
                >
                  <img
                    src="/src/assets/icons/instagram.svg"
                    alt=""
                    class="footer__social-icon footer__social-icon--default"
                  />
                  <img
                    src="/src/assets/icons/instagram-dark.svg"
                    alt=""
                    class="footer__social-icon footer__social-icon--hover"
                  />
                </a>
              </li>
              <li>
                <a
                  href="https://facebook.com"
                  target="_blank"
                  rel="noopener"
                  class="footer__social"
                  aria-label="Facebook"
                >
                  <img
                    src="/src/assets/icons/facebook.svg"
                    alt=""
                    class="footer__social-icon footer__social-icon--default"
                  />
                  <img
                    src="/src/assets/icons/facebook-dark.svg"
                    alt=""
                    class="footer__social-icon footer__social-icon--hover"
                  />
                </a>
              </li>
            </ul>
          </div>

          <!-- Правая часть: контакты -->
          <div class="footer__contacts">
            <h3 class="footer__contacts-title">Contact us</h3>

            <ul class="footer__contacts-list">
              <li class="footer__contact">
                <a
                  href="https://maps.google.com/?q=8558+Green+Rd,+LA"
                  target="_blank"
                  rel="noopener"
                  class="footer__contact-link"
                >
                  <img
                    src="/src/assets/icons/pin-alt.svg"
                    alt=""
                    class="footer__contact-icon"
                  />
                  <span>8558 Green Rd., LA</span>
                </a>
              </li>

              <li class="footer__contact">
                <a href="tel:+16035550123" class="footer__contact-link">
                  <img
                    src="/src/assets/icons/phone.svg"
                    alt=""
                    class="footer__contact-icon"
                  />
                  <span>+1 (603) 555-0123</span>
                </a>
              </li>

              <li class="footer__contact">
                <span class="footer__contact-link">
                  <img
                    src="/src/assets/icons/clock.svg"
                    alt=""
                    class="footer__contact-icon"
                  />
                  <span>Mon–Sat: 9:00–23:00</span>
                </span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
